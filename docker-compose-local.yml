services:
  cudl-tei-processing:
    extends:
      file: docker-compose-base.yml
      service: cudl-tei-processing
    environment:
      ENVIRONMENT: local
      TEI_FILE: ${TEI_FILE}
      SEARCH_HOST: host.docker.internal
      SKIP_COPY_TEI_WEB_ASSETS: ${SKIP_COPY_TEI_WEB_ASSETS:-true}
      SKIP_PAGE_XML_COPY: ${SKIP_PAGE_XML_COPY:-true}
      SKIP_CORE_XML_COPY: ${SKIP_CORE_XML_COPY:-true}
      SKIP_TEI_FULL_COPY: ${SKIP_TEI_FULL_COPY:-false}
      ENABLE_SHA_METADATA: ${ENABLE_SHA_METADATA:-false}
      ENABLE_RELEASE_STATUS_METADATA: ${ENABLE_RELEASE_STATUS_METADATA:-false}
      XSLT_FAIL_ON_ERROR: ${XSLT_FAIL_ON_ERROR:-true}
    volumes:
      - dist:/tmp/opt/cdcp/dist
      - source:/tmp/opt/cdcp/cudl-data-source
    entrypoint: ["python", "/var/task/local_runner.py"]
volumes:
  dist:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./dist
  source:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data
