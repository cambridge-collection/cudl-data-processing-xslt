[project]
name = "cudl-tei-processing"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.0",
    "boto3-stubs[s3]",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.black]
target-version = ["py312"]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: Docker-based integration tests (require Docker daemon)"]
addopts = "-m 'not integration'"
